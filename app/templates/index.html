<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#03080f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>THE BOSS - Jarvis Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <header class="header">
            <div class="title-area">
                <div class="brand-wrapper">
                    <div class="brand-icon"></div>
                    <h1 class="brand-title">THE BOSS</h1>
                </div>
                <h2 class="welcome-text">Good Evening, <span>Boss.</span></h2>
                <p class="subtitle">How can I help you today?</p>
            </div>
            
            <div class="top-right-panel">
                <svg class="settings-toggle" id="settings-toggle" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                <div class="time-card">
                    <div class="time-display" id="clock-time">00:00:00 PM</div>
                    <div class="date-display" id="clock-date">Loading Chronos...</div>
                </div>
            </div>
        </header>

        <main class="main-content">
            
            <div class="hex-grid-all">
                <div class="hex-grid-left">
                    <div class="hex-btn" data-action="voice">
                        <svg class="hex-svg" viewBox="0 0 100 115"><polygon points="50,5 95,30 95,85 50,110 5,85 5,30"/></svg>
                        <div class="hex-inner">
                            <svg class="hex-icon" viewBox="0 0 24 24"><path d="M12 1v22M17 5v14M7 5v14M22 9v6M2 9v6"/></svg>
                            <div class="hex-label">Voice</div>
                        </div>
                    </div>
                    <div class="hex-btn" data-action="apps">
                        <svg class="hex-svg" viewBox="0 0 100 115"><polygon points="50,5 95,30 95,85 50,110 5,85 5,30"/></svg>
                        <div class="hex-inner">
                            <svg class="hex-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                            <div class="hex-label">Apps</div>
                        </div>
                    </div>
                    <div class="hex-btn" data-action="browser">
                        <svg class="hex-svg" viewBox="0 0 100 115"><polygon points="50,5 95,30 95,85 50,110 5,85 5,30"/></svg>
                        <div class="hex-inner">
                            <svg class="hex-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                            <div class="hex-label">Browser</div>
                        </div>
                    </div>
                </div>
                <div class="hex-grid-right">
                    <div class="hex-btn" data-action="ai-chat">
                        <svg class="hex-svg" viewBox="0 0 100 115"><polygon points="50,5 95,30 95,85 50,110 5,85 5,30"/></svg>
                        <div class="hex-inner">
                            <svg class="hex-icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                            <div class="hex-label">AI Chat</div>
                        </div>
                    </div>
                    <div class="hex-btn" data-action="tasks">
                        <svg class="hex-svg" viewBox="0 0 100 115"><polygon points="50,5 95,30 95,85 50,110 5,85 5,30"/></svg>
                        <div class="hex-inner">
                            <svg class="hex-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/></svg>
                            <div class="hex-label">Tasks</div>
                        </div>
                    </div>
                    <div class="hex-btn" data-action="weather">
                        <svg class="hex-svg" viewBox="0 0 100 115"><polygon points="50,5 95,30 95,85 50,110 5,85 5,30"/></svg>
                        <div class="hex-inner">
                            <svg class="hex-icon" viewBox="0 0 24 24"><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                            <div class="hex-label">Weather</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="center-orb-wrapper">
                <div class="orb-layer layer-outer"></div>
                <div class="orb-layer layer-mid"></div>
                <div class="orb-layer layer-inner-tech"></div>
                <div class="orb-core" id="orb-core-engine"></div>
            </div>

        </main>

        <div class="tap-to-speak-container" id="speak-trigger">
            <span class="tap-text">Tap to Speak</span>
            <div class="tap-node"></div>
        </div>

        <section class="system-status-panel">
            <div class="status-title-wrapper">
                <div class="status-line"></div>
                <h3 class="status-heading">SYSTEM STATUS</h3>
                <div class="status-line"></div>
            </div>

            <div class="ecg-container">
                <svg class="ecg-svg" viewBox="0 0 400 40">
                    <path class="ecg-path" d="M 0 20 L 120 20 L 130 5 L 140 35 L 150 15 L 158 23 L 165 20 L 280 20 L 290 5 L 300 35 L 310 15 L 318 23 L 325 20 L 400 20" />
                </svg>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <svg class="stat-icon" viewBox="0 0 24 24"><rect x="1" y="6" width="18" height="12" rx="2" ry="2"/><line x1="23" y1="11" x2="23" y2="13"/></svg>
                    <span class="stat-label">BATTERY</span>
                    <span class="stat-value" id="stat-battery">78%</span>
                </div>
                <div class="stat-card">
                    <svg class="stat-icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="15" x2="23" y2="15"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="15" x2="4" y2="15"/></svg>
                    <span class="stat-label">MEMORY</span>
                    <span class="stat-value" id="stat-memory">62%</span>
                </div>
                <div class="stat-card">
                    <svg class="stat-icon" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v6c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 11v6c0 1.66 4 3 9 3s9-1.34 9-3v-6"/></svg>
                    <span class="stat-label">STORAGE</span>
                    <span class="stat-value">128 GB</span>
                </div>
                <div class="stat-card">
                    <svg class="stat-icon" viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20" stroke-width="3" stroke-linecap="round"/></svg>
                    <span class="stat-label">NETWORK</span>
                    <span class="stat-value online">ONLINE</span>
                </div>
            </div>
        </section>

        <footer class="footer">
            <div class="nav-item active" data-action="jarvis">
                <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                <span>JARVIS</span>
            </div>
            
            <div class="center-action-trigger" id="center-trigger">
                <svg class="trigger-arrow" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
            </div>
            
            <div class="nav-item" data-action="history">
                <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span>HISTORY</span>
            </div>
        </footer>

    </div>

    <!-- ═══ TIMER OVERLAY ═══ -->
    <div id="timerOverlay" class="timer-overlay" style="display:none;">
        <div class="timer-card">
            <div class="timer-label" id="timerLabel">Timer</div>
            <div class="timer-display" id="timerDisplay">00:00</div>
            <div class="timer-progress" id="timerProgress">
                <div class="timer-progress-bar" id="timerProgressBar"></div>
            </div>
            <button id="dismissTimerBtn" class="timer-dismiss-btn" style="display:none;" onclick="TimerManager.dismissAlert()">✕ Dismiss</button>
            <button id="cancelTimerBtn" class="timer-cancel-btn" onclick="TimerManager.cancelTimer()">Cancel</button>
        </div>
    </div>

    <!-- ═══ IMAGE DISPLAY OVERLAY ═══ -->
    <div id="imageDisplay" class="image-overlay" style="display:none;">
        <div class="image-overlay-inner">
            <img id="generatedImg" src="" alt="Generated Image">
            <div class="image-overlay-hint">TAP TO CLOSE</div>
        </div>
    </div>

    <!-- ═══ TOAST NOTIFICATIONS ═══ -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="device.js"></script>
    <script src="timer.js"></script>
    <script src="script.js"></script>
</body>
</html>
