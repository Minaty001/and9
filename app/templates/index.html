<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#030101">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>J.A.R.V.I.S. — Neural Integration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #030101;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Rajdhani', 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Nebula / Stardust background effect */
    .nebula {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 15% 25%, rgba(255, 200, 150, 0.6), transparent),
        radial-gradient(4px 4px at 30% 75%, rgba(255, 160, 50, 0.4), transparent),
        radial-gradient(3px 3px at 65% 45%, rgba(255, 180, 80, 0.5), transparent),
        radial-gradient(2px 2px at 85% 85%, rgba(255, 200, 150, 0.7), transparent),
        radial-gradient(6px 6px at 10% 90%, rgba(255, 100, 0, 0.3), transparent),
        radial-gradient(3px 3px at 95% 10%, rgba(255, 200, 100, 0.4), transparent),
        radial-gradient(2px 2px at 50% 50%, rgba(255, 150, 50, 0.2), transparent);
      z-index: 0;
      pointer-events: none;
    }

    /* Canvas for the dynamic integrating neural nets */
    #neuralCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Subtle grid overlay (orange tint) */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 140, 0, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 140, 0, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
      animation: gridMove 20s linear infinite;
      pointer-events: none;
    }
    @keyframes gridMove {
      0% { background-position: 0 0, 0 0; }
      100% { background-position: 0 40px, 40px 0; }
    }

    /* Scanlines (amber tint) */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg,
        transparent,
        transparent 2px,
        rgba(255, 140, 0, 0.05) 2px,
        rgba(255, 140, 0, 0.05) 4px);
      pointer-events: none;
      z-index: 999;
      animation: scanAnim 0.08s linear infinite;
    }
    @keyframes scanAnim {
      0% { transform: translateY(0); }
      100% { transform: translateY(4px); }
    }

    /* Main container */
    .jarvis-interface {
      position: relative;
      z-index: 2;
      width: 95vw;
      max-width: 750px;
      height: 90vh;
      max-height: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      pointer-events: auto;
    }

    /* Holographic Circle Container */
    .holo-circle {
      position: relative;
      width: 65vmin;
      height: 65vmin;
      max-width: 420px;
      max-height: 420px;
      min-width: 240px;
      min-height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Concentric Orange/Gold Rings */
    .ring {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: drop-shadow(0 0 10px rgba(255, 140, 0, 0.3));
    }
    .ring-1 {
      width: 100%;
      height: 100%;
      border: 2px solid rgba(255, 170, 0, 0.25);
      animation: spinClock 16s linear infinite;
    }
    .ring-2 {
      width: 88%;
      height: 88%;
      border: 3px dashed rgba(255, 140, 0, 0.15);
      animation: spinCounter 20s linear infinite;
    }
    .ring-3 {
      width: 76%;
      height: 76%;
      border: 1px solid rgba(255, 200, 100, 0.3);
      animation: spinClock 24s linear infinite;
      filter: drop-shadow(0 0 20px #ff8800);
    }
    .ring-4 {
      width: 64%;
      height: 64%;
      border: 2px solid rgba(255, 150, 0, 0.2);
      animation: spinCounter 12s linear infinite;
    }

    @keyframes spinClock {
      from { transform: rotate(0deg) scale(1); }
      to { transform: rotate(360deg) scale(1); }
    }
    @keyframes spinCounter {
      from { transform: rotate(360deg) scale(1); }
      to { transform: rotate(0deg) scale(1); }
    }

    /* Thick Golden Arcs */
    .arc {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .arc-thick {
      width: 75%;
      height: 75%;
      border: 6px solid transparent;
      border-top-color: #ffaa00;
      border-right-color: #ffaa00;
      filter: drop-shadow(0 0 15px #ff8800) drop-shadow(0 0 30px #ff5500);
      transform: rotate(45deg);
      clip-path: inset(0 0 30% 0);
      animation: arcSpin 8s linear infinite;
    }
    .arc-thin {
      width: 68%;
      height: 68%;
      border: 2px solid transparent;
      border-bottom-color: rgba(255, 160, 0, 0.7);
      border-left-color: rgba(255, 160, 0, 0.7);
      filter: drop-shadow(0 0 15px #ff8800);
      transform: rotate(120deg);
      clip-path: inset(30% 0 0 0);
      animation: arcSpin 10s linear infinite reverse;
    }
    .arc-dash {
      width: 90%;
      height: 90%;
      border: 2px dashed rgba(255, 180, 0, 0.2);
      border-radius: 50%;
      transform: rotate(15deg);
      animation: arcSpin 14s linear infinite reverse;
    }
    
    @keyframes arcSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Central Glowing Orb Core */
    .orb-core {
      position: absolute;
      width: 24%;
      height: 24%;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 30%,
        #fff4a0 0%,
        #ffcc00 15%,
        #ff8800 40%,
        #cc5500 70%,
        #220800 100%);
      box-shadow:
        0 0 60px rgba(255, 200, 0, 0.8),
        0 0 120px rgba(255, 150, 0, 0.6),
        0 0 200px rgba(255, 100, 0, 0.4),
        inset 0 0 40px rgba(255, 255, 200, 0.5);
      cursor: pointer;
      z-index: 10;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }


    .orb-core:focus-visible {
      outline: 3px solid #ffaa00;
      outline-offset: 4px;
    }

    .send-btn:focus-visible {
      outline: 2px solid #ffaa00;
      outline-offset: 2px;
    }

    .orb-core.listening {
      animation: orbPulseListen 0.8s ease-in-out infinite;
    }
    .orb-core.processing {
      animation: orbPulseProcess 0.4s ease-in-out infinite;
      background: radial-gradient(circle at 40% 30%, #fff4a0, #ff8800, #cc3300, #110200);
    }
    .orb-core.integrating {
      animation: orbPulseIntegrate 0.2s ease-in-out infinite;
      background: radial-gradient(circle at 40% 30%, #ffffff, #ffcc00, #ff5500, #220800);
      box-shadow: 0 0 100px #fff, 0 0 200px #ffcc00, 0 0 300px #ff8800;
    }
    @keyframes orbPulseListen {
      0%,100% { transform: scale(1); box-shadow: 0 0 80px #ffcc00, 0 0 160px #ff8800, 0 0 240px #ff4400; }
      50% { transform: scale(1.06); box-shadow: 0 0 120px #ffdd00, 0 0 200px #ffaa00, 0 0 300px #ff5500; }
    }
    @keyframes orbPulseProcess {
      0%,100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.04) rotate(3deg); }
      75% { transform: scale(0.96) rotate(-3deg); }
    }
    @keyframes orbPulseIntegrate {
      0%,100% { transform: scale(1.2) rotate(0deg); box-shadow: 0 0 150px #fff, 0 0 300px #ffcc00; }
      50% { transform: scale(0.9) rotate(180deg); box-shadow: 0 0 250px #fff, 0 0 500px #ff8800; }
    }

    .orb-inner-glow {
      width: 45%;
      height: 45%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Waveform bars */
    .waveform-ring {
      position: absolute;
      width: 45%;
      height: 45%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 11;
    }
    .waveform-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 25px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .waveform-bars.active {
      opacity: 1;
    }
    .bar {
      width: 3px;
      border-radius: 2px;
      background: #ffcc00;
      box-shadow: 0 0 8px #ffcc00;
      animation: barJump 0.5s ease-in-out infinite;
    }
    .bar:nth-child(1) { animation-delay: 0s; }
    .bar:nth-child(2) { animation-delay: 0.07s; }
    .bar:nth-child(3) { animation-delay: 0.14s; }
    .bar:nth-child(4) { animation-delay: 0.21s; }
    .bar:nth-child(5) { animation-delay: 0.28s; }
    .bar:nth-child(6) { animation-delay: 0.35s; }
    .bar:nth-child(7) { animation-delay: 0.42s; }
    .bar:nth-child(8) { animation-delay: 0.49s; }
    @keyframes barJump {
      0%,100% { height: 3px; }
      50% { height: 20px; }
    }

    .status-text {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      color: #ffaa00;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-shadow: 0 0 10px #ff8800, 0 0 20px #ff4400;
      pointer-events: none;
      z-index: 5;
    }

    /* Terminal Panel */
    .holo-panel {
      width: 100%;
      max-width: 520px;
      background: rgba(10, 5, 0, 0.75);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 170, 0, 0.4);
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(255, 140, 0, 0.15), inset 0 0 30px rgba(255, 100, 0, 0.05);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 1.2rem;
      border-bottom: 1px solid rgba(255, 170, 0, 0.25);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: #ffaa00;
      text-shadow: 0 0 6px #ff8800;
    }
    .header-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffcc00;
      box-shadow: 0 0 12px #ffaa00;
    }
    .chat-log {
      flex: 1;
      min-height: 80px;
      max-height: 160px;
      overflow-y: auto;
      padding: 0.8rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: #ffddaa;
    }
    .chat-log::-webkit-scrollbar { width: 3px; }
    .chat-log::-webkit-scrollbar-thumb { background: #ffaa0040; border-radius: 10px; }

    .msg-line {
      display: flex;
      gap: 0.5rem;
      align-items: baseline;
      animation: fadeSlide 0.4s ease;
    }
    .msg-line.user { flex-direction: row-reverse; }
    .msg-tag {
      font-weight: 700;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: #ffaa00;
      text-shadow: 0 0 6px #ff8800;
      min-width: 45px;
    }
    .msg-line.user .msg-tag { color: #ffaa00; text-shadow: 0 0 6px #ff8800; }
    .msg-content {
      background: rgba(255, 170, 0, 0.08);
      border: 1px solid rgba(255, 170, 0, 0.2);
      padding: 0.25rem 0.8rem;
      border-radius: 14px;
      word-break: break-word;
    }
    .msg-line.user .msg-content {
      background: rgba(255, 140, 0, 0.15);
      border-color: rgba(255, 140, 0, 0.3);
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 0.2rem 0;
    }
    .typing-indicator span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ffaa00;
      animation: typeBounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typeBounce {
      0%,60%,100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-8px); opacity: 1; }
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      border-top: 1px solid rgba(255, 170, 0, 0.2);
      align-items: center;
    }
    .cmd-input {
      flex: 1;
      background: rgba(30, 15, 0, 0.6);
      border: 1px solid rgba(255, 170, 0, 0.3);
      border-radius: 25px;
      padding: 0.5rem 1rem;
      color: #ffddaa;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      outline: none;
      transition: 0.3s;
    }
    .cmd-input:focus {
      border-color: #ffaa00;
      box-shadow: 0 0 18px #ff880040;
    }
    .cmd-input::placeholder { color: #7a5a3a; }
    .send-btn {
      background: rgba(255, 170, 0, 0.1);
      border: 1px solid #ffaa00;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffaa00;
      transition: 0.3s;
      flex-shrink: 0;
    }
    .send-btn:hover {
      background: rgba(255, 170, 0, 0.25);
      box-shadow: 0 0 20px #ff8800;
    }
    .send-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    /* ═══ TIMER OVERLAY ═══ */
    .timer-overlay {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(3, 1, 1, 0.92);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: timerFadeIn 0.3s ease;
    }
    .timer-overlay.alerting {
      background: rgba(40, 5, 0, 0.95);
      animation: timerAlertPulse 0.8s ease-in-out infinite;
    }
    @keyframes timerFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes timerAlertPulse {
      0%, 100% { background: rgba(40, 5, 0, 0.95); }
      50% { background: rgba(80, 10, 0, 0.98); }
    }
    .timer-card {
      text-align: center;
      padding: 40px 32px;
      max-width: 360px;
      width: 85%;
    }
    .timer-label {
      font-size: clamp(1rem, 4vw, 1.3rem);
      color: rgba(255, 200, 100, 0.6);
      letter-spacing: 1px;
      margin-bottom: 16px;
      font-weight: 400;
      transition: color 0.3s;
    }
    .timer-label.alerted {
      color: #ff4444;
      font-weight: 600;
      animation: timerTextGlow 0.6s ease-in-out infinite alternate;
    }
    .timer-display {
      font-size: clamp(3.5rem, 18vw, 6rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #ffaa00;
      text-shadow: 0 0 30px rgba(255, 170, 0, 0.3);
      letter-spacing: 4px;
      font-family: 'Orbitron', 'Courier New', monospace;
      transition: color 0.3s, text-shadow 0.3s;
      margin-bottom: 24px;
      line-height: 1.2;
    }
    .timer-display.alerted {
      color: #ff4444;
      text-shadow: 0 0 40px rgba(255, 60, 60, 0.5);
      font-size: clamp(4rem, 20vw, 7rem);
      animation: timerTextGlow 0.6s ease-in-out infinite alternate;
    }
    @keyframes timerTextGlow {
      from { text-shadow: 0 0 20px rgba(255, 60, 60, 0.4); }
      to { text-shadow: 0 0 60px rgba(255, 60, 60, 0.8); }
    }
    .timer-progress {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 32px;
    }
    .timer-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #ffaa00, #ff8800);
      border-radius: 4px;
      width: 100%;
      transition: width 1s linear;
    }
    .timer-dismiss-btn, .timer-cancel-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.6);
      padding: 10px 28px;
      border-radius: 24px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      min-height: 44px;
      touch-action: manipulation;
      letter-spacing: 1px;
    }
    .timer-dismiss-btn {
      background: rgba(255, 60, 60, 0.12);
      border-color: rgba(255, 60, 60, 0.3);
      color: #ff6666;
      margin-right: 8px;
    }
    .timer-dismiss-btn:hover {
      background: rgba(255, 60, 60, 0.22);
    }
    .timer-cancel-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .timer-cancel-btn:active, .timer-dismiss-btn:active {
      transform: scale(0.96);
    }

    /* ═══ IMAGE OVERLAY ═══ */
    .image-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .image-overlay-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px;
    }
    .image-overlay img {
      max-width: 90vw;
      max-height: 70vh;
      border-radius: 14px;
      border: 2px solid #ffaa00;
      box-shadow: 0 0 40px rgba(255, 170, 0, 0.3);
    }
    .image-overlay-hint {
      color: #ffaa00;
      font-size: 12px;
      letter-spacing: 2px;
      margin-top: 8px;
    }

    /* ═══ TOAST NOTIFICATIONS ═══ */
    .toast-container {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 400;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }
    .toast-msg {
      background: rgba(255, 170, 0, 0.12);
      border: 1px solid rgba(255, 170, 0, 0.25);
      color: #ffaa00;
      padding: 9px 18px;
      border-radius: 24px;
      font-size: 13px;
      font-family: 'Rajdhani', sans-serif;
      backdrop-filter: blur(12px);
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .toast-msg.show {
      opacity: 1;
      transform: translateY(0);
    }
    .toast-msg.error {
      background: rgba(255, 71, 87, 0.12);
      border-color: rgba(255, 71, 87, 0.3);
      color: #ff4757;
    }
    .toast-msg.success {
      background: rgba(0, 255, 136, 0.1);
      border-color: rgba(0, 255, 136, 0.25);
      color: #00ff88;
    }

    @media (max-width: 600px) {
      .holo-circle {
        width: 80vmin;
        height: 80vmin;
      }
      .status-text { font-size: 0.55rem; }
      .holo-panel { max-width: 95%; }
    }
  </style>
</head>
<body>
  <div class="nebula"></div>
  <canvas id="neuralCanvas"></canvas>
  <div class="bg-grid"></div>
  <div class="scanlines"></div>

  <div class="jarvis-interface">
    <!-- Holographic Reactor -->
    <div class="holo-circle" id="holoCircle">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
      <div class="ring ring-4"></div>
      
      <div class="arc arc-thick"></div>
      <div class="arc arc-thin"></div>
      <div class="arc arc-dash"></div>
      
      <div class="orb-core" id="orbCore" role="button" aria-label="Toggle voice input" tabindex="0">
        <div class="orb-inner-glow"></div>
      </div>
      
      <div class="waveform-ring">
        <div class="waveform-bars" id="waveformBars">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
      </div>
      
      <div class="status-text" id="orbStatus">J.A.R.V.I.S. ONLINE</div>
    </div>

    <!-- Terminal -->
    <div class="holo-panel">
      <div class="panel-header">
        <span class="header-dot"></span> NEURAL COMMS LOG
      </div>
      <div class="chat-log" id="chatLog">
        <div class="msg-line jarvis">
          <span class="msg-tag">JARVIS</span>
          <span class="msg-content">Neural network integrated. Golden cores synchronized.</span>
        </div>
      </div>
      <div class="input-row">
        <input type="text" class="cmd-input" id="cmdInput" placeholder="Enter command..." autocomplete="off" aria-label="Command input">
        <button class="send-btn" id="sendBtn" title="Send command" aria-label="Send command">
          <svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- TIMER OVERLAY -->
  <div id="timerOverlay" class="timer-overlay" style="display:none;">
    <div class="timer-card">
      <div class="timer-label" id="timerLabel">Timer</div>
      <div class="timer-display" id="timerDisplay">00:00</div>
      <div class="timer-progress" id="timerProgress">
        <div class="timer-progress-bar" id="timerProgressBar"></div>
      </div>
      <button id="dismissTimerBtn" class="timer-dismiss-btn" style="display:none;" onclick="TimerManager.dismissAlert()">✕ Dismiss</button>
      <button id="cancelTimerBtn" class="timer-cancel-btn" onclick="TimerManager.cancelTimer()">Cancel</button>
    </div>
  </div>

  <!-- IMAGE OVERLAY -->
  <div id="imageDisplay" class="image-overlay" style="display:none;">
    <div class="image-overlay-inner">
      <img id="generatedImg" src="" alt="Generated Image">
      <div class="image-overlay-hint">TAP TO CLOSE</div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="device.js"></script>
  <script src="timer.js"></script>
  <script>
    (function() {
      // ---- Neural Network Canvas ----
      const canvas = document.getElementById('neuralCanvas');
      const ctx = canvas.getContext('2d');
      let width, height;
      let animationFrame;
      
      const nodes = [];
      const connections = [];
      const center = { x: 0, y: 0 };
      let isIntegrating = false; // global flag for integration frenzy
      
      class Node {
        constructor(x, y, type = 'neuron') {
          this.x = x;
          this.y = y;
          this.baseX = x;
          this.baseY = y;
          this.type = type;
          this.radius = type === 'hub' ? 2.5 : 1.5;
          this.angle = Math.random() * Math.PI * 2;
          this.distance = Math.random() * 0.3 + 0.2;
          this.orbitSpeed = (Math.random() - 0.5) * 0.002;
          this.color = type === 'hub' ? '#ffdd00' : '#ff8800';
          this.glow = type === 'hub' ? 8 : 4;
        }
        
        update(time) {
          this.angle += this.orbitSpeed;
          const dist = this.distance * Math.min(width, height);
          this.x = center.x + Math.cos(this.angle) * dist;
          this.y = center.y + Math.sin(this.angle * 0.8) * dist;
        }
        
        draw(ctx) {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
          ctx.fillStyle = this.color;
          ctx.shadowColor = this.color;
          ctx.shadowBlur = this.glow;
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }
      
      function initNeuralNetwork() {
        nodes.length = 0;
        connections.length = 0;
        center.x = width / 2;
        center.y = height / 2;
        
        // Hub nodes near center
        for (let i = 0; i < 5; i++) {
          const angle = (i / 5) * Math.PI * 2;
          const dist = 0.1 * Math.min(width, height);
          nodes.push(new Node(center.x + Math.cos(angle) * dist, center.y + Math.sin(angle) * dist, 'hub'));
        }
        
        // Outer nodes
        const nodeCount = 70;
        for (let i = 0; i < nodeCount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = (Math.random() * 0.4 + 0.2) * Math.min(width, height);
          nodes.push(new Node(center.x + Math.cos(angle) * dist, center.y + Math.sin(angle) * dist, 'neuron'));
        }
        
        // Create Neural Connections (Integrating the nets)
        for (let i = 0; i < nodes.length; i++) {
          // Connect each node to 2-3 other nodes
          let count = 0;
          for (let j = i+1; j < nodes.length && count < 3; j++) {
            const dx = nodes[j].x - nodes[i].x;
            const dy = nodes[j].y - nodes[i].y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            // Only connect nodes that are relatively close
            if (dist < 250 && Math.random() < 0.3) {
              connections.push({
                from: nodes[i],
                to: nodes[j],
                progress: Math.random(),
                speed: 0.005 + Math.random() * 0.015
              });
              count++;
            }
          }
        }
      }
      
      function drawConnection(conn, time) {
        const from = conn.from;
        const to = conn.to;
        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 5) return;

        // Draw the connecting line (glowing golden)
        ctx.beginPath();
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x, to.y);
        
        // During integration, lines pulse brighter and faster
        const alpha = isIntegrating ? (0.5 + Math.sin(time/100) * 0.4) : 0.15;
        const lineWidth = isIntegrating ? (2 + Math.sin(time/150) * 1.5) : 1;
        ctx.strokeStyle = `rgba(255, 170, 0, ${alpha})`;
        ctx.lineWidth = lineWidth;
        ctx.stroke();

        // Draw the traveling data pulse (showing active integration)
        const pulseX = from.x + dx * conn.progress;
        const pulseY = from.y + dy * conn.progress;
        
        ctx.beginPath();
        ctx.arc(pulseX, pulseY, isIntegrating ? 4 : 2, 0, Math.PI*2);
        ctx.fillStyle = '#ffcc00';
        ctx.shadowColor = '#fff';
        ctx.shadowBlur = isIntegrating ? 30 : 8;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Update pulse position
        conn.progress += conn.speed * (isIntegrating ? 8 : 1); // Speed boost during integration
        if (conn.progress > 1) conn.progress = 0;
      }
      
      function drawStarburstRays(time) {
        const rayCount = 36;
        for (let i = 0; i < rayCount; i++) {
          const baseAngle = (i / rayCount) * Math.PI * 2;
          const angle = baseAngle + Math.sin(time / 3000 + i * 0.3) * 0.05;
          const length = (0.6 + Math.sin(time / 4000 + i * 0.7) * 0.4) * Math.min(width, height) * 0.7;
          
          ctx.beginPath();
          ctx.moveTo(center.x, center.y);
          ctx.lineTo(center.x + Math.cos(angle) * length, center.y + Math.sin(angle) * length);
          
          const grad = ctx.createLinearGradient(center.x, center.y, center.x + Math.cos(angle) * length, center.y + Math.sin(angle) * length);
          grad.addColorStop(0, 'rgba(255, 200, 100, 0.9)');
          grad.addColorStop(0.2, 'rgba(255, 150, 50, 0.6)');
          grad.addColorStop(1, 'rgba(255, 100, 0, 0)');
          
          ctx.strokeStyle = grad;
          ctx.lineWidth = 0.8 + Math.sin(time / 5000 + i) * 0.6;
          ctx.stroke();
        }
      }
      
      function animateNeural(time) {
        ctx.clearRect(0, 0, width, height);
        
        // Update node positions
        nodes.forEach(node => node.update(time));
        
        // 1. Draw rays
        drawStarburstRays(time);
        
        // 2. Draw interconnecting neural paths (Integrating)
        connections.forEach(conn => drawConnection(conn, time));
        
        // 3. Draw nodes over the lines
        nodes.forEach(node => node.draw(ctx));
        
        animationFrame = requestAnimationFrame(animateNeural);
      }
      
      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        center.x = width/2;
        center.y = height/2;
        initNeuralNetwork();
      }
      
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
      animationFrame = requestAnimationFrame(animateNeural);
      
      // ---- JARVIS Interface Logic ----
      const $ = id => document.getElementById(id);
      const orbCore = $('orbCore');
      const orbStatus = $('orbStatus');
      const waveformBars = $('waveformBars');
      const chatLog = $('chatLog');
      const cmdInput = $('cmdInput');
      const sendBtn = $('sendBtn');
      const imageDisplay = $('imageDisplay');
      const generatedImg = $('generatedImg');
      const toastContainer = $('toastContainer');

      let isListening = false;
      let isProcessing = false;
      let recognition = null;
      const synth = window.speechSynthesis;
      let currentUtterance = null;

      function scrollChatToBottom() {
        chatLog.scrollTop = chatLog.scrollHeight;
      }

      function showToast(msg, type) {
        const el = document.createElement('div');
        el.className = 'toast-msg ' + (type || '');
        el.textContent = msg;
        toastContainer.appendChild(el);
        requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
        setTimeout(() => {
          el.classList.remove('show');
          setTimeout(() => el.remove(), 300);
        }, 2500);
      }

      function addMessage(role, text) {
        const line = document.createElement('div');
        line.className = `msg-line ${role}`;
        const tag = role === 'jarvis' ? 'JARVIS' : 'YOU';
        line.innerHTML = `<span class="msg-tag">${tag}</span><span class="msg-content">${escapeHTML(text)}</span>`;
        chatLog.appendChild(line);
        scrollChatToBottom();
        return line;
      }

      function addTypingIndicator() {
        const indicator = document.createElement('div');
        indicator.className = 'msg-line jarvis typing-line';
        indicator.innerHTML = `
          <span class="msg-tag">JARVIS</span>
          <span class="msg-content"><div class="typing-indicator"><span></span><span></span><span></span></div></span>
        `;
        chatLog.appendChild(indicator);
        scrollChatToBottom();
        return indicator;
      }

      function removeTypingIndicator(el) {
        if (el && el.parentNode) el.remove();
      }

      function escapeHTML(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // New Integration Sequence Trigger
      function triggerIntegrationSequence() {
        if (isIntegrating) return;
        isIntegrating = true;
        orbCore.classList.add('integrating');
        orbStatus.textContent = 'SYNCHRONIZING NETS...';
        
        // Turn off after 4 seconds
        setTimeout(() => {
          isIntegrating = false;
          orbCore.classList.remove('integrating');
          orbStatus.textContent = 'NEURAL NETS INTEGRATED';
          // Reset back to online after a brief pause
          setTimeout(() => {
            if (!isListening && !isProcessing) orbStatus.textContent = 'J.A.R.V.I.S. ONLINE';
          }, 2000);
        }, 4000);
      }

      // API call helper
      async function apiCall(endpoint, data) {
        try {
          const resp = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
          return await resp.json();
        } catch (e) {
          return null;
        }
      }

      function generateLocalResponse(input) {
        const inp = input.toLowerCase().trim();
        
        // Trigger the integration effect if the user asks for it!
        if (inp.includes('integrate') || inp.includes('sync') || inp.includes('synchronize')) {
          triggerIntegrationSequence();
          return 'Initiating full neural synchronization. Integrating all clusters... complete. All networks are now interacting as a singular hive-mind.';
        }

        const responses = {
          'hello': 'Hello. Neural pathways active and synchronized.',
          'hi': 'Greetings. All systems integrated.',
          'hey': 'Good day. How may the golden core assist?',
          'how are you': 'All neural cores nominal. Processing at optimal efficiency.',
          'what is your name': 'I am J.A.R.V.I.S., a neural‑integrated AI.',
          'who are you': 'I am your personal assistant, powered by interconnected neural networks.',
          'what can you do': 'I manage diagnostics, process data through neural clusters, and answer queries.',
          'time': `Current time: ${new Date().toLocaleTimeString()}.`,
          'date': `Today is ${new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}.`,
          'status': 'Neural network status: 92% synaptic load. All links are actively communicating.',
          'weather': 'Weather module offline. However, internal environment is optimal.',
          'joke': 'Why did the neural network cross the road? To find the global minimum.',
          'thank': 'You are welcome. Synapses firing in gratitude.',
          'thanks': 'Always a pleasure to assist.',
          'bye': 'Standing by. Neural circuits will remain active.',
          'goodbye': 'Goodbye. I will maintain background processing.',
          'help': 'Ask about time, date, status, or just converse. Tap the reactor orb for voice input. Try saying "Integrate" to see the neural nets merge!',
        };
        for (let key of Object.keys(responses)) {
          if (inp.includes(key)) return responses[key];
        }
        const defaults = [
          'Interesting query. I am distributing it across neural clusters.',
          'Noted. My networks are analyzing that.',
          'Understood. Any additional parameters?',
          'Acknowledged. Neural processing underway.',
        ];
        return defaults[Math.floor(Math.random() * defaults.length)];
      }

      function speakResponse(text) {
        if (currentUtterance) synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.9;
        utterance.pitch = 1.0;
        utterance.volume = 0.8;
        const voices = synth.getVoices();
        const pref = voices.find(v => v.name.includes('Daniel') || v.name.includes('Google UK Male') || v.name.includes('Male'));
        if (pref) utterance.voice = pref;
        currentUtterance = utterance;
        synth.speak(utterance);
        utterance.onend = () => { currentUtterance = null; };
      }

      // Main processor hooked up to the Flask APIs
      async function processUserInput(text) {
        if (!text.trim()) return;
        addMessage('user', text.trim());
        cmdInput.value = '';
        
        const typingEl = addTypingIndicator();
        setProcessingState(true);
        
        // 1. Try multi-agent API first
        let result = await apiCall('/api/multi-agent', { message: text.trim(), mode: 'auto' });
        let responseText;
        
        if (result && result.status === 'success' && result.response) {
          responseText = result.response;
        } else {
          // Fallback: try POST /api/chat
          let chatResult = await apiCall('/api/chat', { message: text.trim() });
          if (chatResult && chatResult.reply) {
            responseText = chatResult.reply;
            result = chatResult;
          } else {
            // Final fallback: local responses
            responseText = generateLocalResponse(text);
          }
        }
        
        removeTypingIndicator(typingEl);
        setProcessingState(false);
        
        addMessage('jarvis', responseText);
        speakResponse(responseText);

        // Check for device execution intents from response
        if (result && result.intent) {
          if (typeof DeviceControl !== 'undefined') {
            DeviceControl.executeIntent(result.intent);
          }
        }
        
        // Check for image URL in result
        if (result && result.image_url) {
          showImage(result.image_url);
        }
      }

      function setListeningState(active) {
        isListening = active;
        if (active) {
          orbCore.classList.add('listening');
          orbStatus.textContent = 'LISTENING...';
          waveformBars.classList.add('active');
        } else {
          orbCore.classList.remove('listening');
          if (!isProcessing) {
            orbStatus.textContent = 'J.A.R.V.I.S. ONLINE';
            waveformBars.classList.remove('active');
          }
        }
      }

      // Processing animation state
      function setProcessingState(active) {
        isProcessing = active;
        if (active) {
          orbCore.classList.add('processing');
          orbStatus.textContent = 'PROCESSING';
          waveformBars.classList.add('active');
        } else {
          orbCore.classList.remove('processing');
          if (!isListening) {
            orbStatus.textContent = 'J.A.R.V.I.S. ONLINE';
            waveformBars.classList.remove('active');
          }
        }
      }

      function resetOrbState() {
        isListening = false;
        isProcessing = false;
        orbCore.classList.remove('listening', 'processing', 'integrating');
        orbStatus.textContent = 'J.A.R.V.I.S. ONLINE';
        waveformBars.classList.remove('active');
      }

      // Image overlay display
      function showImage(url) {
        generatedImg.src = url;
        imageDisplay.style.display = 'flex';
      }
      imageDisplay.addEventListener('click', () => {
        imageDisplay.style.display = 'none';
        generatedImg.src = '';
      });

      function initRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return null;
        const recog = new SpeechRecognition();
        recog.continuous = false;
        recog.interimResults = false;
        recog.lang = 'en-US';
        
        recog.onstart = () => setListeningState(true);
        recog.onresult = (e) => {
          const transcript = e.results[0][0].transcript;
          setListeningState(false);
          if (transcript.trim()) processUserInput(transcript);
          else resetOrbState();
        };
        recog.onerror = (e) => {
          console.warn('Speech error:', e.error);
          setListeningState(false);
          resetOrbState();
          if (e.error === 'not-allowed') {
            addMessage('jarvis', 'Microphone access denied. Enable it for voice commands.');
          }
        };
        recog.onend = () => {
          setListeningState(false);
          if (!isProcessing) resetOrbState();
        };
        return recog;
      }

      recognition = initRecognition();

      function toggleVoice() {
        if (isProcessing || isIntegrating) return;
        if (isListening) {
          if (recognition) recognition.abort();
          resetOrbState();
          return;
        }
        if (!recognition) recognition = initRecognition();
        if (recognition) {
          try { recognition.start(); } catch (ex) {
            recognition.abort();
            setTimeout(() => { try { recognition.start(); } catch(e) {} }, 100);
          }
        } else {
          addMessage('jarvis', 'Voice input not supported. Use text commands.');
        }
      }


      orbCore.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleVoice();
        }
      });

      orbCore.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleVoice();
      });

      sendBtn.addEventListener('click', () => {
        if (cmdInput.value.trim()) processUserInput(cmdInput.value);
      });

      cmdInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (cmdInput.value.trim()) processUserInput(cmdInput.value);
        }
      });

      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === ' ') {
          e.preventDefault();
          toggleVoice();
        }
      });

      if (synth) {
        synth.getVoices();
        synth.onvoiceschanged = () => synth.getVoices();
      }

      scrollChatToBottom();
      console.log('%c🧠 J.A.R.V.I.S. Neural Integration Active %c| %cTap orb, Ctrl+Space, or type "Integrate"',
        'color:#ffaa00;', 'color:#aaa;', 'color:#ffcc00;');
    })();
  </script>
</body>
